services:
  # Go API Backend
  - type: web
    name: note-taking-api-staging
    env: go
    plan: free # Zero cost for staging
    buildCommand: |
      cd backend
      go install -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@v4.20.1
      go build -o bin/server ./cmd/server
    startCommand: |
      cd backend
      # Apply pending migrations before starting the server
      $(go env GOPATH)/bin/migrate -path ./migrations -database "$DATABASE_URL" up
      ./bin/server
    envVars:
      - key: APP_ENV
        value: staging
      - key: DATABASE_URL
        fromDatabase:
          name: note-taking-db-staging
          property: connectionString
      - key: POSTGRES_HOST
        fromDatabase:
          name: note-taking-db-staging
          property: host
      - key: POSTGRES_PORT
        fromDatabase:
          name: note-taking-db-staging
          property: port
      - key: POSTGRES_USER
        fromDatabase:
          name: note-taking-db-staging
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: note-taking-db-staging
          property: password
      - key: POSTGRES_DB
        fromDatabase:
          name: note-taking-db-staging
          property: database
      # Leave empty while the frontend reaches the API through the Vercel /api
      # rewrite (same origin). List exact frontend origins here only if the
      # browser calls this service directly; "*" is refused.
      - key: ALLOWED_ORIGINS
        value: ""

databases:
  # Managed PostgreSQL Staging Database
  - name: note-taking-db-staging
    plan: free
