basePath: /api/v1
definitions:
  backend_internal_model.Item:
    properties:
      child_ids:
        items:
          type: string
        type: array
      created_at:
        type: string
      id:
        type: string
      parent_id:
        type: string
      parent_page_id:
        type: string
      props:
        $ref: '#/definitions/backend_internal_model.Props'
      trashed_at:
        type: string
      type:
        $ref: '#/definitions/backend_internal_model.ItemType'
      updated_at:
        type: string
      user_id:
        type: string
    type: object
  backend_internal_model.ItemType:
    enum:
    - workspace
    - page
    - paragraph
    - heading
    - bulletListItem
    - numberedListItem
    - checkListItem
    - toggleListItem
    - quote
    type: string
    x-enum-varnames:
    - ItemTypeWorkspace
    - ItemTypePage
    - ItemTypeParagraph
    - ItemTypeHeading
    - ItemTypeBulletListItem
    - ItemTypeNumberedListItem
    - ItemTypeCheckListItem
    - ItemTypeToggleListItem
    - ItemTypeQuote
  backend_internal_model.Op:
    properties:
      id:
        type: string
      op:
        allOf:
        - $ref: '#/definitions/backend_internal_model.OpType'
        enum:
        - create
        - update
        - move
        - delete
        - trash
        - restore
      parent_id:
        type: string
      position:
        type: integer
      props:
        $ref: '#/definitions/backend_internal_model.Props'
      type:
        $ref: '#/definitions/backend_internal_model.ItemType'
    type: object
  backend_internal_model.OpType:
    enum:
    - create
    - update
    - move
    - delete
    - trash
    - restore
    type: string
    x-enum-varnames:
    - OpCreate
    - OpUpdate
    - OpMove
    - OpDelete
    - OpTrash
    - OpRestore
  backend_internal_model.Props:
    additionalProperties: {}
    type: object
  internal_handlers.ApplyOpsRequest:
    properties:
      ops:
        items:
          $ref: '#/definitions/backend_internal_model.Op'
        type: array
    type: object
  internal_handlers.ItemResponse:
    properties:
      ancestors:
        items:
          $ref: '#/definitions/backend_internal_model.Item'
        type: array
      focus_id:
        type: string
      in_trash:
        type: boolean
      items:
        items:
          $ref: '#/definitions/backend_internal_model.Item'
        type: array
    type: object
  internal_handlers.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  internal_handlers.SignupRequest:
    properties:
      email:
        type: string
      name:
        type: string
      password:
        type: string
    required:
    - email
    - name
    - password
    type: object
  internal_handlers.TrashResponse:
    properties:
      pages:
        items:
          $ref: '#/definitions/internal_handlers.TrashedPage'
        type: array
    type: object
  internal_handlers.TrashedPage:
    properties:
      child_ids:
        items:
          type: string
        type: array
      created_at:
        type: string
      id:
        type: string
      parent_id:
        type: string
      parent_page_id:
        type: string
      props:
        $ref: '#/definitions/backend_internal_model.Props'
      purge_at:
        type: string
      trashed_at:
        type: string
      type:
        $ref: '#/definitions/backend_internal_model.ItemType'
      updated_at:
        type: string
      user_id:
        type: string
    type: object
  internal_handlers.UpdateUserRequest:
    properties:
      name:
        type: string
    type: object
  internal_handlers.UserResponse:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: string
      name:
        type: string
      updated_at:
        type: string
    type: object
info:
  contact: {}
  description: |-
    API for managing users and their pages and blocks.
    Authentication: log in with POST /auth/login (or sign up), which sets the session in the HttpOnly "sid" cookie. The browser sends it with every later request, including from this page. State-changing requests from other sites are refused.
  title: Note Taking App API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Checks the email and password, starts a session and sets it in
        the sid cookie (HttpOnly, SameSite=Lax). Returns the user.
      parameters:
      - description: Login credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handlers.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          headers:
            Set-Cookie:
              description: sid=<session id>
              type: string
          schema:
            $ref: '#/definitions/internal_handlers.UserResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: wrong email or password, the same for an unknown email
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Log in
      tags:
      - auth
  /auth/logout:
    post:
      description: Ends the session in the sid cookie and clears the cookie. Succeeds
        without a session too.
      responses:
        "204":
          description: No Content
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Log out
      tags:
      - auth
  /auth/logout-all:
    post:
      description: Ends every session of the logged-in user, on every device, and
        clears the sid cookie.
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - SessionCookie: []
      summary: Log out of all devices
      tags:
      - auth
  /auth/signup:
    post:
      consumes:
      - application/json
      description: Creates an account, starts a session and sets it in the sid cookie
        (HttpOnly, SameSite=Lax). Returns the new user. The name is trimmed and must
        be 1 to 50 characters; the password must be 6 to 72 bytes; the email must
        be a valid, deliverable address.
      parameters:
      - description: Signup details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handlers.SignupRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          headers:
            Set-Cookie:
              description: sid=<session id>
              type: string
          schema:
            $ref: '#/definitions/internal_handlers.UserResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
        "422":
          description: Unprocessable Entity
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Sign up
      tags:
      - auth
  /items/{id}:
    get:
      description: For a page id, returns the page and everything under it as one
        flat list in document order (child pages included, not their content), plus
        its ancestor pages. For a block id, returns the page that contains the block,
        with focus_id set to the block. The workspace root cannot be opened.
      parameters:
      - description: Page or block id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handlers.ItemResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - SessionCookie: []
      summary: Open a page or block
      tags:
      - items
  /items/{id}/duplicate:
    post:
      description: Deep-copies the item and everything under it, child pages included,
        with new ids, and places the copy right after the original. A copied page
        is named "Name (Copy N)". Copied pages are not favorites.
      parameters:
      - description: Page or block id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/backend_internal_model.Item'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - SessionCookie: []
      summary: Duplicate a page or block
      tags:
      - items
  /ops:
    post:
      consumes:
      - application/json
      description: 'Applies up to 500 create, update, move, delete, trash and restore
        operations in order, all-or-nothing. restore takes a page out of the trash
        and puts it under parent_id at position, or at the end of the top level without
        parent_id; a page inside a trashed page cannot be restored on its own. A batch
        that moves pages to the trash also removes the user''s pages that have been
        in the trash longer than the retention period. Ids are chosen by the client.
        position is an index into the parent''s child_ids when the operation runs,
        not counting the item itself; without it the item goes at the end, except
        that a page added to the end of a page goes before its trailing empty paragraph.
        update merges props key by key: null values, and wrong values for keys the
        type relies on, are ignored. Rejected: unknown types, other users'' items,
        items inside a trashed page, positions out of range, cycles, delete on a page,
        trash on a block, changing between page and block, a heading without a level,
        and props over 64 KB. A rejection names the failing operation in op_index.'
      parameters:
      - description: Operations to apply
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handlers.ApplyOpsRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties: true
            type: object
        "413":
          description: Request Entity Too Large
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - SessionCookie: []
      summary: Apply a batch of changes
      tags:
      - items
  /pages:
    get:
      description: Returns every page that is not in the trash, in document order.
        parent_id is the direct parent (a block, a page or the workspace); parent_page_id
        is the nearest page above, left out for a top-level page.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/backend_internal_model.Item'
            type: array
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - SessionCookie: []
      summary: List pages for the sidebar
      tags:
      - items
  /trash:
    delete:
      description: Removes every page in the trash, and everything inside them, for
        good.
      produces:
      - application/json
      responses:
        "200":
          description: 'deleted: how many pages were removed'
          schema:
            additionalProperties:
              type: integer
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - SessionCookie: []
      summary: Empty the trash
      tags:
      - trash
    get:
      description: Returns the pages in the trash, most recently trashed first. Pages
        inside a trashed page are not listed on their own. Pages past the retention
        period are left out; they are removed the next time something is moved to
        the trash.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handlers.TrashResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - SessionCookie: []
      summary: List the trash
      tags:
      - trash
  /trash/{id}:
    delete:
      description: Removes a page in the trash and everything inside it. This cannot
        be undone.
      parameters:
      - description: Page id
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - SessionCookie: []
      summary: Delete a page for good
      tags:
      - trash
  /trash/{id}/restore:
    post:
      description: Puts the page back at the end of the top level, with everything
        that was inside it. To restore it somewhere else, send a restore operation
        to /ops. A page inside a trashed page cannot be restored on its own.
      parameters:
      - description: Page id
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - SessionCookie: []
      summary: Restore a page from the trash
      tags:
      - trash
  /users/me:
    get:
      description: Returns the authenticated user's profile (never includes the password
        hash)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handlers.UserResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - SessionCookie: []
      summary: Get the current user
      tags:
      - users
    put:
      consumes:
      - application/json
      description: 'Changes the logged-in user''s name: trimmed, 1 to 50 characters.
        The email cannot be changed yet; a body with "email" gets 400.'
      parameters:
      - description: Fields to update
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handlers.UpdateUserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handlers.UserResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - SessionCookie: []
      summary: Update the current user
      tags:
      - users
  /workspace:
    get:
      description: Returns the user's hidden workspace item. Its child_ids are the
        top-level pages; create a top-level page with it as parent_id.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/backend_internal_model.Item'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - SessionCookie: []
      summary: Get the workspace root
      tags:
      - items
securityDefinitions:
  SessionCookie:
    description: Set by POST /auth/login or /auth/signup; the browser sends it by
      itself.
    in: cookie
    name: sid
    type: apiKey
swagger: "2.0"
