basePath: /api/v1
definitions:
  backend_internal_model.Item:
    properties:
      created_at:
        type: string
      icon:
        type: string
      id:
        type: string
      is_favorite:
        type: boolean
      name:
        type: string
      parent_id:
        type: string
      type:
        $ref: '#/definitions/backend_internal_model.ItemType'
      updated_at:
        type: string
      user_id:
        type: string
    type: object
  backend_internal_model.ItemType:
    enum:
    - note
    - folder
    type: string
    x-enum-varnames:
    - ItemTypeNote
    - ItemTypeFolder
  backend_internal_model.NoteContent:
    properties:
      content:
        type: string
      item_id:
        type: string
      updated_at:
        type: string
    type: object
  backend_internal_pkg.AuthResponse:
    properties:
      access_token:
        type: string
      refresh_token:
        type: string
    type: object
  backend_internal_pkg.LoginRequest:
    properties:
      email:
        type: string
      password:
        minLength: 6
        type: string
    required:
    - email
    - password
    type: object
  backend_internal_pkg.RefreshTokenRequest:
    properties:
      token:
        type: string
    required:
    - token
    type: object
  backend_internal_pkg.SignupResponse:
    properties:
      email:
        maxLength: 254
        type: string
      name:
        type: string
      password:
        minLength: 6
        type: string
    required:
    - email
    - name
    - password
    type: object
  internal_services.CreateItemRequest:
    properties:
      content:
        type: string
      icon:
        type: string
      id:
        description: optional, if not provided, a new UUID will be generated
        type: string
      is_favorite:
        type: boolean
      name:
        type: string
      parent_id:
        type: string
      type:
        allOf:
        - $ref: '#/definitions/backend_internal_model.ItemType'
        enum:
        - note
        - folder
    type: object
  internal_services.MoveItemEntry:
    properties:
      id:
        type: string
      parentID:
        type: string
    type: object
  internal_services.MoveItemsRequest:
    properties:
      items:
        items:
          $ref: '#/definitions/internal_services.MoveItemEntry'
        type: array
    type: object
  internal_services.PutContentRequest:
    properties:
      content:
        type: string
    type: object
  internal_services.UpdateItemRequest:
    properties:
      icon:
        type: string
      is_favorite:
        type: boolean
      name:
        type: string
    type: object
  internal_services.UpdateUserRequest:
    properties:
      email:
        type: string
      name:
        type: string
    type: object
  internal_services.UserResponse:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: string
      name:
        type: string
      updated_at:
        type: string
    type: object
info:
  contact: {}
  description: API for managing users and their items (notes and folders).
  title: Note Taking App API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticates a user and returns access/refresh tokens
      parameters:
      - description: Login credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/backend_internal_pkg.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/backend_internal_pkg.AuthResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Log in
      tags:
      - auth
  /auth/refresh-token:
    post:
      consumes:
      - application/json
      description: Exchanges a refresh token for a new access token
      parameters:
      - description: Refresh token
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/backend_internal_pkg.RefreshTokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/backend_internal_pkg.AuthResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Refresh access token
      tags:
      - auth
  /auth/signup:
    post:
      consumes:
      - application/json
      description: Creates a new user account and returns access/refresh tokens
      parameters:
      - description: Signup details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/backend_internal_pkg.SignupResponse'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/backend_internal_pkg.AuthResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
        "422":
          description: Unprocessable Entity
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Sign up
      tags:
      - auth
  /items:
    get:
      description: Returns the authenticated user's items without note content, folders
        first and then by name. Use parent_id to list only the children of one folder,
        or parent_id=null for the top level.
      parameters:
      - description: Folder id, or the word null for the top level
        in: query
        name: parent_id
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/backend_internal_model.Item'
            type: array
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List items
      tags:
      - items
    patch:
      consumes:
      - application/json
      description: Moves items into a destination folder (or the top level when parent_id
        is null). Every entry needs a parent_id. Moving a folder moves everything
        inside it; nothing is copied. The whole request is applied atomically. Returns
        the items in request order.
      parameters:
      - description: Items to move and their new parents
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_services.MoveItemsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/backend_internal_model.Item'
            type: array
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
        "413":
          description: Request Entity Too Large
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Move items
      tags:
      - items
    post:
      consumes:
      - application/json
      description: Creates a note or a folder, optionally inside a folder. With the
        cloneFromId query parameter it instead duplicates that item (and, for a folder,
        everything inside it) next to the original, named "Name (Copy N)"; the request
        body must then be empty. Duplicating is atomic.
      parameters:
      - description: Id of the item to duplicate. When set, the body must be empty.
        in: query
        name: cloneFromId
        type: string
      - description: Item to create
        in: body
        name: request
        schema:
          $ref: '#/definitions/internal_services.CreateItemRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/backend_internal_model.Item'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
        "413":
          description: Request Entity Too Large
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create or duplicate an item
      tags:
      - items
  /items/{id}:
    delete:
      description: Deletes one item. Deleting a folder deletes everything inside it.
      parameters:
      - description: Item ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Delete an item
      tags:
      - items
    get:
      description: Returns one item, without note content
      parameters:
      - description: Item ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/backend_internal_model.Item'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get an item
      tags:
      - items
    patch:
      consumes:
      - application/json
      description: 'Edits the name, icon and/or favorite flag of one item. Partial
        update: omitted fields are left unchanged, and unknown fields are rejected.
        An empty icon resets it to the default for the item''s type. Use PATCH /items
        to move items.'
      parameters:
      - description: Item ID
        in: path
        name: id
        required: true
        type: string
      - description: Fields to update
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_services.UpdateItemRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/backend_internal_model.Item'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "413":
          description: Request Entity Too Large
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update an item
      tags:
      - items
  /items/{id}/content:
    get:
      description: Returns the body of a note. Folders have no content.
      parameters:
      - description: Item ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/backend_internal_model.NoteContent'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get a note's content
      tags:
      - items
    put:
      consumes:
      - application/json
      description: Replaces the body of a note and bumps the note's updated_at. Folders
        have no content.
      parameters:
      - description: Item ID
        in: path
        name: id
        required: true
        type: string
      - description: New content
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_services.PutContentRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/backend_internal_model.NoteContent'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "413":
          description: Request Entity Too Large
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Replace a note's content
      tags:
      - items
  /users/me:
    get:
      description: Returns the authenticated user's profile (never includes the password
        hash)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_services.UserResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get the current user
      tags:
      - users
    put:
      consumes:
      - application/json
      description: 'Updates the authenticated user''s own profile (name and/or email).
        Partial update: omitted fields are left unchanged.'
      parameters:
      - description: Fields to update
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_services.UpdateUserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_services.UserResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update the current user
      tags:
      - users
securityDefinitions:
  BearerAuth:
    description: Type "Bearer" followed by a space and the JWT access token.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
