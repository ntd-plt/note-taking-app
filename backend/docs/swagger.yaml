basePath: /api/v1
definitions:
  backend_internal_model.Item:
    properties:
      child_ids:
        items:
          type: string
        type: array
      created_at:
        type: string
      id:
        type: string
      parent_id:
        type: string
      parent_page_id:
        type: string
      props:
        $ref: '#/definitions/backend_internal_model.Props'
      trashed_at:
        type: string
      type:
        $ref: '#/definitions/backend_internal_model.ItemType'
      updated_at:
        type: string
      user_id:
        type: string
    type: object
  backend_internal_model.ItemType:
    enum:
    - workspace
    - page
    - paragraph
    - heading
    - bulletListItem
    - numberedListItem
    - checkListItem
    - toggleListItem
    - quote
    type: string
    x-enum-varnames:
    - ItemTypeWorkspace
    - ItemTypePage
    - ItemTypeParagraph
    - ItemTypeHeading
    - ItemTypeBulletListItem
    - ItemTypeNumberedListItem
    - ItemTypeCheckListItem
    - ItemTypeToggleListItem
    - ItemTypeQuote
  backend_internal_model.Op:
    properties:
      id:
        type: string
      op:
        allOf:
        - $ref: '#/definitions/backend_internal_model.OpType'
        enum:
        - create
        - update
        - move
        - delete
        - trash
      parent_id:
        type: string
      position:
        type: integer
      props:
        $ref: '#/definitions/backend_internal_model.Props'
      type:
        $ref: '#/definitions/backend_internal_model.ItemType'
    type: object
  backend_internal_model.OpType:
    enum:
    - create
    - update
    - move
    - delete
    - trash
    type: string
    x-enum-varnames:
    - OpCreate
    - OpUpdate
    - OpMove
    - OpDelete
    - OpTrash
  backend_internal_model.Props:
    additionalProperties: {}
    type: object
  backend_internal_pkg.AuthResponse:
    properties:
      access_token:
        type: string
      refresh_token:
        type: string
    type: object
  backend_internal_pkg.LoginRequest:
    properties:
      email:
        type: string
      password:
        minLength: 6
        type: string
    required:
    - email
    - password
    type: object
  backend_internal_pkg.RefreshTokenRequest:
    properties:
      token:
        type: string
    required:
    - token
    type: object
  backend_internal_pkg.SignupResponse:
    properties:
      email:
        maxLength: 254
        type: string
      name:
        type: string
      password:
        minLength: 6
        type: string
    required:
    - email
    - name
    - password
    type: object
  internal_services.ApplyOpsRequest:
    properties:
      ops:
        items:
          $ref: '#/definitions/backend_internal_model.Op'
        type: array
    type: object
  internal_services.ItemResponse:
    properties:
      ancestors:
        items:
          $ref: '#/definitions/backend_internal_model.Item'
        type: array
      focus_id:
        type: string
      in_trash:
        type: boolean
      items:
        items:
          $ref: '#/definitions/backend_internal_model.Item'
        type: array
    type: object
  internal_services.UpdateUserRequest:
    properties:
      email:
        type: string
      name:
        type: string
    type: object
  internal_services.UserResponse:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: string
      name:
        type: string
      updated_at:
        type: string
    type: object
info:
  contact: {}
  description: API for managing users and their pages and blocks.
  title: Note Taking App API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticates a user and returns access/refresh tokens
      parameters:
      - description: Login credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/backend_internal_pkg.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/backend_internal_pkg.AuthResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Log in
      tags:
      - auth
  /auth/refresh-token:
    post:
      consumes:
      - application/json
      description: Exchanges a refresh token for a new access token
      parameters:
      - description: Refresh token
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/backend_internal_pkg.RefreshTokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/backend_internal_pkg.AuthResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Refresh access token
      tags:
      - auth
  /auth/signup:
    post:
      consumes:
      - application/json
      description: Creates a new user account and returns access/refresh tokens
      parameters:
      - description: Signup details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/backend_internal_pkg.SignupResponse'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/backend_internal_pkg.AuthResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
        "422":
          description: Unprocessable Entity
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Sign up
      tags:
      - auth
  /items/{id}:
    get:
      description: For a page id, returns the page and everything under it as one
        flat list in document order (child pages included, not their content), plus
        its ancestor pages. For a block id, returns the page that contains the block,
        with focus_id set to the block. The workspace root cannot be opened.
      parameters:
      - description: Page or block id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_services.ItemResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Open a page or block
      tags:
      - items
  /items/{id}/duplicate:
    post:
      description: Deep-copies the item and everything under it, child pages included,
        with new ids, and places the copy right after the original. A copied page
        is named "Name (Copy N)". Copied pages are not favorites.
      parameters:
      - description: Page or block id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/backend_internal_model.Item'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Duplicate a page or block
      tags:
      - items
  /ops:
    post:
      consumes:
      - application/json
      description: 'Applies up to 500 create, update, move, delete and trash operations
        in order, all-or-nothing. Ids are chosen by the client. position is an index
        into the parent''s child_ids when the operation runs, not counting the item
        itself; without it the item goes at the end, except that a page added to the
        end of a page goes before its trailing empty paragraph. update merges props
        key by key: null values, and wrong values for keys the type relies on, are
        ignored. Rejected: unknown types, other users'' items, items inside a trashed
        page, positions out of range, cycles, delete on a page, trash on a block,
        changing between page and block, a heading without a level, and props over
        64 KB. A rejection names the failing operation in op_index.'
      parameters:
      - description: Operations to apply
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_services.ApplyOpsRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties: true
            type: object
        "413":
          description: Request Entity Too Large
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Apply a batch of changes
      tags:
      - items
  /pages:
    get:
      description: Returns every page that is not in the trash, in document order.
        parent_id is the direct parent (a block, a page or the workspace); parent_page_id
        is the nearest page above, left out for a top-level page.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/backend_internal_model.Item'
            type: array
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List pages for the sidebar
      tags:
      - items
  /users/me:
    get:
      description: Returns the authenticated user's profile (never includes the password
        hash)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_services.UserResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get the current user
      tags:
      - users
    put:
      consumes:
      - application/json
      description: 'Updates the authenticated user''s own profile (name and/or email).
        Partial update: omitted fields are left unchanged.'
      parameters:
      - description: Fields to update
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_services.UpdateUserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_services.UserResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update the current user
      tags:
      - users
  /workspace:
    get:
      description: Returns the user's hidden workspace item. Its child_ids are the
        top-level pages; create a top-level page with it as parent_id.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/backend_internal_model.Item'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get the workspace root
      tags:
      - items
securityDefinitions:
  BearerAuth:
    description: Type "Bearer" followed by a space and the JWT access token.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
